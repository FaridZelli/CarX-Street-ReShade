<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarX Street ZINHAR ReShade</title>
    <style>
      /* Page background and base styling */
      body {
        background-color: #101010;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: #fff;
      }
      /* Flex container for centering content vertically and horizontally */
      .main-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      h1 {
        text-align: center;
        font-size: 1.5rem;
        margin-top: 20px;
      }
      hr.custom-divider {
      border: none;
      height: 2px;
      background-color: #333;
      width: 80%;
      margin-bottom: 40px;
    }
      a {
      color: #2196f3;
      text-decoration: none;
    }
      img.badge {
      margin: 20px;
    }

      /* Container styling for the comparisons */
      .comparisons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        width: 100%;
      }
      /* Each image comparison container */
      .img-comp-container {
        position: relative;
        width: 900px;
        max-width: 100%;
        overflow: hidden;
      }
      .img-comp-container img {
        display: block;
        width: 100%;
      }
      /* Overlay styling */
      .img-comp-overlay {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        z-index: 2;
      }
      .img-comp-overlay img {
        display: block;
        width: 100%;
      }
      /* Slider handle styling */
      .img-comp-slider {
        position: absolute;
        z-index: 4;
        cursor: ew-resize;
        width: 42px;
        height: 42px;
        background-color: #2196f3;
        opacity: 0.7;
        border-radius: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.2rem;
        color: #fff;
        user-select: none;
      }
      /* Slider text inside the blue circle */
      .slider-text {
        pointer-events: none;
      }
      /* Label styling */
      .img-comp-label {
        position: absolute;
        bottom: 6.0rem;
        padding: 8px 10px;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border-radius: 3px;
        pointer-events: none;
      }
      .img-comp-label.original {
        right: 10px;
        z-index: 1;
      }
      .img-comp-overlay .img-comp-label.zinhar {
        left: 10px;
        z-index: 3;
      }
      /* Footer styling */
      footer {
        width: 100%;
        background-color: #181818;
        text-align: center;
        padding: 10px 0;
        margin-top: 40px;
      }
      footer a {
        color: #2196f3;
        text-decoration: none;
      }
      /* Mobile styles */
      @media (max-width: 600px) {
        /* Make the container stretch to full width */
        .img-comp-container {
          width: 100%;
        }
        /* Adjust heading, labels, and slider to more standard mobile sizes */
        h2 {
          font-size: 1.5rem;
        }
        footer {
        width: 100%;
        background-color: #181818;
        text-align: center;
        padding: 10px 0;
        margin-top: 40px;
        font-size: 14px;
      }
        .img-comp-label {
          font-size: 8px;
          padding: 4px 5px;
          bottom: 2.2rem;
        }
        .img-comp-slider {
          width: 38px;
          height: 38px;
          font-size: 1.0rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <h1>CarX Street ZINHAR ReShade Screenshots</h1>
        <a href="https://github.com/FaridZelli/CarX-Street-ReShade" target="_blank">View project on GitHub</a>
        <a href="https://github.com/FaridZelli/CarX-Street-ReShade" target="_blank">
        <img class="badge" alt="Static Badge" src="https://img.shields.io/github/downloads/FaridZelli/CarX-Street-ReShade/total?style=for-the-badge&logo=github&label=Total%20Downloads&labelColor=blue&color=green&cacheSeconds=7200">
        </a>
      <hr class="custom-divider">
      <div class="comparisons">
        <!-- Comparison 1 -->
        <div class="img-comp-container">
          <!-- Bottom Image -->
          <img src="screenshots/image2.jpg" alt="Image 2" />
          <!-- "Original" label on bottom image -->
          <div class="img-comp-label original">ZINHAR ReShade</div>
          <!-- Overlay with top image and label -->
          <div class="img-comp-overlay">
            <img src="screenshots/image1.jpg" alt="Image 1" />
            <div class="img-comp-label zinhar">Original</div>
          </div>
          <!-- Slider handle -->
          <div class="img-comp-slider">
            <span class="slider-text">&lt;|&gt;</span>
          </div>
        </div>
        <!-- Comparison 2 -->
        <div class="img-comp-container">
          <img src="screenshots/image4.jpg" alt="Image 4" />
          <div class="img-comp-label original">ZINHAR ReShade</div>
          <div class="img-comp-overlay">
            <img src="screenshots/image3.jpg" alt="Image 3" />
            <div class="img-comp-label zinhar">Original</div>
          </div>
          <div class="img-comp-slider">
            <span class="slider-text">&lt;|&gt;</span>
          </div>
        </div>
        <!-- Comparison 3 -->
        <div class="img-comp-container">
          <img src="screenshots/image6.jpg" alt="Image 6" />
          <div class="img-comp-label original">ZINHAR ReShade</div>
          <div class="img-comp-overlay">
            <img src="screenshots/image5.jpg" alt="Image 5" />
            <div class="img-comp-label zinhar">Original</div>
          </div>
          <div class="img-comp-slider">
            <span class="slider-text">&lt;|&gt;</span>
          </div>
        </div>
      </div>
      <!-- Footer -->
      <footer>
        <p>
          &copy; 2025 Farid Zellipour. All rights reserved.<br />
          <a href="https://github.com/FaridZelli/CarX-Street-ReShade" target="_blank">
            CarX Street ZINHAR ReShade on GitHub
          </a>
        </p>
      </footer>
    </div>

    <script>
      // Global variable to hold the active container during dragging
      let activeCont = null;

      // Initializes a single comparison container.
      function initComparison(compContainer) {
        var slider = compContainer.querySelector(".img-comp-slider");
        var overlay = compContainer.querySelector(".img-comp-overlay");

        // Position the slider handle to the center of the container.
        function initSlider() {
          var containerWidth = compContainer.offsetWidth;
          var containerHeight = compContainer.offsetHeight;
          var centerPos = containerWidth / 2;
          slider.style.left = centerPos + "px";
          overlay.style.clip = "rect(0px, " + centerPos + "px, " + containerHeight + "px, 0px)";
        }

        // Update slider and overlay clip based on clientX.
        function updateSlider(clientX) {
          var rect = compContainer.getBoundingClientRect();
          var pos = clientX - rect.left;
          if (pos < 0) pos = 0;
          if (pos > rect.width) pos = rect.width;
          slider.style.left = pos + "px";
          overlay.style.clip = "rect(0px, " + pos + "px, " + rect.height + "px, 0px)";
        }

        // Initiate dragging on mousedown/touchstart on the slider.
        slider.addEventListener("mousedown", function (e) {
          activeCont = { container: compContainer, update: updateSlider };
          e.preventDefault();
        });
        slider.addEventListener("touchstart", function (e) {
          activeCont = { container: compContainer, update: updateSlider };
          e.preventDefault();
        });
        return initSlider;
      }

      // Listen for mousemove / touchmove events on the document
      document.addEventListener("mousemove", function (e) {
        if (activeCont) {
          activeCont.update(e.clientX);
        }
      });
      document.addEventListener("touchmove", function (e) {
        if (activeCont && e.touches.length) {
          activeCont.update(e.touches[0].clientX);
        }
      });
      // End dragging when the mouse or touch is released anywhere.
      document.addEventListener("mouseup", function () {
        activeCont = null;
      });
      document.addEventListener("touchend", function () {
        activeCont = null;
      });

      // Initialize all comparisons when the window loads.
      window.addEventListener("load", function () {
        document.querySelectorAll(".img-comp-container").forEach(function (container) {
          var initSlider = initComparison(container);
          initSlider();
        });
      });

      // Recenter all sliders when the window is resized.
      window.addEventListener("resize", function () {
        document.querySelectorAll(".img-comp-container").forEach(function (container) {
          var slider = container.querySelector(".img-comp-slider");
          var overlay = container.querySelector(".img-comp-overlay");
          var containerWidth = container.offsetWidth;
          var centerPos = containerWidth / 2;
          slider.style.left = centerPos + "px";
          overlay.style.clip =
            "rect(0px, " + centerPos + "px, " + container.offsetHeight + "px, 0px)";
        });
      });
    </script>
  </body>
</html>
